{% from "_form_labels.html" import field_label %}
<fieldset class="stack">
  <legend>{{ field_label("Vouchers") }}</legend>
  <div id="sample-vouchers"></div>
  <div id="sample-voucher-picker" class="picker">
    <div class="inline-form">
      <label>Add a voucher <input class="picker-query" type="search" maxlength="100" autocomplete="off" placeholder="Name, accession or ID"></label>
      <button type="button" class="secondary picker-search">Search</button>
    </div>
    <p class="feedback" role="status"></p>
    <ul class="picker-results"></ul>
  </div>
</fieldset>
<div class="form-grid">
  <label>{{ field_label("Sample code") }} <input name="code" required maxlength="80"></label>
  <label>{{ field_label("Plant part") }} <select name="plant_part" required>
    {% if choose_details %}<option value="">Choose plant part</option>{% endif %}
    <option value="leaf">Leaf</option><option value="flower">Flower</option><option value="inflorescence">Inflorescence</option>
    <option value="aerial parts">Aerial parts</option><option value="stem">Stem</option><option value="root">Root</option>
    <option value="rhizome">Rhizome</option><option value="bark">Bark</option><option value="fruit">Fruit</option>
    <option value="seed">Seed</option><option value="whole plant">Whole plant</option><option value="other">Other</option>
  </select></label>
  <label><span>Plant part details <span id="plant-part-note-required" class="field-note" hidden>Required</span></span>
    <input name="plant_part_note" maxlength="200"></label>
  <label>{{ field_label("Material") }} <select name="material_state" required>
    {% if choose_details %}<option value="">Choose material</option>{% endif %}
    <option value="fresh">Fresh</option><option value="air-dried">Air-dried</option>
    <option value="oven-dried">Oven-dried</option><option value="freeze-dried">Freeze-dried</option>
  </select></label>
  <label>Collection date <input name="collection_date" type="date"></label>
  <label>Phenological stage <input name="phenological_stage" maxlength="100"></label>
  <label>Collection site <select name="site" id="sample-site">
    <option value="">Not recorded</option><option value="voucher">Same as a linked voucher</option>
    <option value="field_location">Its own field location</option>
  </select></label>
  <label id="site-voucher-field" hidden>{{ field_label("Site voucher") }} <select name="site_specimen_id" required disabled></select></label>
  <label id="site-location-field" hidden>{{ field_label("Field location ID") }} <input name="field_loc_id" maxlength="50" required disabled></label>
</div>
<label>Drying <textarea name="drying_notes" maxlength="1000" rows="2"></textarea></label>
<label>Storage <textarea name="storage_notes" maxlength="1000" rows="2"></textarea></label>
<label>Collection notes (private) <input name="collection_notes" maxlength="200"></label>
