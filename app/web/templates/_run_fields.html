{% from "_form_labels.html" import field_label %}
<label>{{ field_label("Technique") }} <select name="technique" class="technique" required>
  <option value="GC-MS">GC-MS</option><option value="GC-FID">GC-FID</option>
  <option value="LC-MS">LC-MS</option><option value="LC-MS/MS">LC-MS/MS</option>
  <option value="HPLC-DAD">HPLC-DAD</option>
  <option value="isolation">Isolation and structure elucidation</option>
</select></label>
<fieldset class="form-grid run-fields full">
  <legend>Run</legend>
  <label data-for="gc lc">Column <input name="run.column" maxlength="200"></label>
  <label data-for="gc">{{ field_label("Column polarity") }} <select name="run.polarity_class" required>
    <option value="">Select column polarity</option>
    <option value="non-polar">Non-polar</option><option value="semi-polar">Semi-polar</option><option value="polar">Polar</option>
  </select></label>
  <label data-for="gc">Stationary phase <input name="run.stationary_phase" maxlength="200"></label>
  <label data-for="gc">Temperature programme <input name="run.temperature_programme" maxlength="1000"></label>
  <label data-for="gc">Carrier gas <input name="run.carrier_gas" maxlength="100"></label>
  <label data-for="gc">Alkane reference series <input name="run.alkane_series" maxlength="200"></label>
  <label data-for="gc">RI type <select name="run.ri_type">
    <option value="">Not stated</option>
    <option value="linear_temperature_programmed">Linear, temperature-programmed (van den Dool &amp; Kratz)</option>
    <option value="isothermal_kovats">Isothermal (Kováts)</option>
  </select></label>
  <label data-for="lc">Mobile phase <input name="run.mobile_phase" maxlength="500"></label>
  <label data-for="lc">Gradient <input name="run.gradient" maxlength="1000"></label>
  <label data-for="lc">Ionisation mode <select name="run.ionisation_mode">
    <option value="">Not stated</option><option>ESI+</option><option>ESI-</option><option>APCI+</option>
    <option>APCI-</option><option>APPI+</option><option>APPI-</option>
  </select></label>
  <label data-for="lc">Mass analyser <input name="run.mass_analyser" maxlength="100"></label>
  <label data-for="isolation" class="full">Isolation procedure <textarea name="run.isolation_procedure" maxlength="2000" rows="3"
    placeholder="e.g. CH2Cl2 extract; silica gel CC (hexane–EtOAc); semi-preparative HPLC, C18, MeOH–H2O"></textarea></label>
  <label data-for="isolation">NMR spectrometer <input name="run.nmr_spectrometer" maxlength="200" placeholder="e.g. Bruker Avance III"></label>
  <label data-for="isolation">NMR frequency (MHz, ¹H) <input name="run.nmr_frequency_mhz" type="number" min="1" max="2000" step="any"></label>
  <label data-for="isolation">NMR solvent <input name="run.nmr_solvent" maxlength="100" placeholder="e.g. CDCl3"></label>
  <label data-for="isolation">HRMS instrument <input name="run.hrms_instrument" maxlength="200"></label>
  <label data-for="isolation">HRMS ionisation <input name="run.hrms_ionisation" maxlength="40" placeholder="e.g. ESI+"></label>
  <label class="full">Data in external repositories <input name="run.data_accessions" maxlength="500"
    placeholder="Optional: nmrXiv, MetaboLights or GNPS accessions, or the supporting-information DOI"></label>
</fieldset>
