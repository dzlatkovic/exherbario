{% extends "base.html" %}
{% block title %}Password · Ex Herbario{% endblock %}
{% block body %}
<section class="card narrow" aria-labelledby="site-password-title">
  <h1 id="site-password-title" class="title">This site is not public yet</h1>
  <p class="muted">Enter the password you were given to open it in this browser.</p>
  {% if problem %}<p class="notice warning" role="alert">{{ problem }}</p>{% endif %}
  <form method="post" action="/site-password" class="stack">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Password <input name="password" type="password" autocomplete="current-password" required autofocus></label>
    <button class="primary">Open</button>
  </form>
</section>
{% endblock %}
