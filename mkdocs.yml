site_name: Ex Herbario Documentation
site_description: User and operator guides for Ex Herbario
site_url: https://docs.exherbarium.org/
repo_url: https://github.com/dzlatkovic/exherbario
repo_name: dzlatkovic/exherbario
edit_uri: edit/main/docs/
theme:
  name: mkdocs
  color_mode: light
  user_color_mode_toggle: true
extra_css:
  - styles.css
validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn
exclude_docs: |
  *.md
  !/index.md
  !/vouchers.md
  !/chemistry.md
  !/ai-extraction.md
  !/depositions.md
  !/darwin-core.md
  !/external-lookups.md
  !/operations.md
nav:
  - Start here: index.md
  - Records and results:
      - Vouchers: vouchers.md
      - Phytochemistry: chemistry.md
      - Prepare a results table: ai-extraction.md
  - Publish:
      - Scientific depositions: depositions.md
      - Darwin Core Archive: darwin-core.md
  - Operate:
      - Install, back up and upgrade: operations.md
      - External lookups: external-lookups.md
  - Project website: https://exherbarium.org/
