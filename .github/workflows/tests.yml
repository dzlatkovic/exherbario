name: Tests

on: [push, pull_request]

jobs:
  sqlite:
    runs-on: ubuntu-latest
    env:
      USER_SECRET: ci-only-herbar-signing-key-for-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: cp env-template .env
      - run: python -m pip install -r requirements.txt
      - run: python -m alembic upgrade head
      - run: python -m pytest
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: test_herbar
          MYSQL_USER: herbar_ci
          MYSQL_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql+pymysql://herbar_ci:ci-password@127.0.0.1:3306/test_herbar
      USER_SECRET: ci-only-herbar-signing-key-for-tests
      HERBAR_TEST_DATABASE_URL: mysql+pymysql://herbar_ci:ci-password@127.0.0.1:3306/test_herbar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: cp env-template .env
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest
      - run: python -m alembic upgrade head
      - run: python -m alembic downgrade base
